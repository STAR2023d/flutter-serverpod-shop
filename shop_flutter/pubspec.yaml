name: shop_flutter
description: Flutter front end for the Serverpod online shop.
version: 1.0.0
publish_to: none

environment:
  sdk: '^3.12.2'

dependencies:
  flutter:
    sdk: flutter
  serverpod_client: 4.0.4  
  serverpod_flutter: 4.0.4
  serverpod_auth_idp_flutter: 4.0.4
  shop_client:
    path: ../shop_client

dev_dependencies:
  flutter_lints: ^6.0.0

# Same pin that `serverpod create` uses (v11 needs compileSdk 37 on Android).
dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true
